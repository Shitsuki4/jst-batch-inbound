<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>无采购单登记</title><link rel="stylesheet" href="/unplanned.css"><link rel="stylesheet" href="/purchase-pairs.css"><script src="/purchase-pairs.js"></script><body><header><h1>无采购单登记</h1><a href="/">返回原收货模块 / 登录</a></header><div id="message" role="status"></div><main><section class="card"><h2>新建 / 查询收货批次</h2><div class="bar"><input id="first-tracking" placeholder="扫描 / 输入第一个物流单号" autocomplete="off"><input id="new-note" placeholder="批次备注（可选）"><button id="new">创建收货批次</button></div><div class="bar"><input id="query" placeholder="批次编号 / 采购单号 / 物流单号 / 备注"><button id="search">查询历史</button><button id="close-history">关闭结果</button></div><div id="history"></div></section><section id="work" hidden><div class="card"><h2 id="title"></h2><div id="meta"></div><div class="bar"><input id="note" placeholder="批次备注"><button id="save-note" data-edit>保存备注</button><button id="reload">刷新批次</button><button id="pause-report">暂存并查看实收对单</button><button id="exit-work">退出批次</button><a id="export" class="button">导出 CSV（Excel可打开）</a></div><div class="bar"><input id="po" placeholder="在ERP按实收建好采购单后，回填单号"><button id="match" data-edit>关联采购单并核对</button><button id="recheck" data-edit>重新核对</button></div><div id="check-status"></div><div class="bar"><select id="warehouse"><option value="">请选择入库仓库</option></select><button id="warehouses">读取仓库</button><button id="inbound">预览并生成待入库单</button></div><div id="jobs"></div></div><div class="card"><h2>扫描登记 / 商品明细修改</h2><div class="bar"><input id="tracking" placeholder="F1 · 扫描或输入物流单号" autocomplete="off"><button id="scan-tracking" data-edit>进入物流单</button></div><div class="bar"><select id="batches"></select><button id="rename" data-edit>修改单号</button><button id="delete-batch" data-edit>删除此物流单</button></div><div class="bar"><input id="code" placeholder="F2 · 扫描商品码" autocomplete="off"><input id="step" type="number" value="1" min="0.000001" step="any" aria-label="本次数量"><button id="scan" data-edit>识别商品</button><button id="manual" data-edit>手动登记商品</button></div><div id="candidates"></div><div id="pending" hidden><strong id="pending-name"></strong><button id="confirm-qty">确认数量并登记</button><button id="cancel-qty">取消</button></div><div id="lines"></div></div><div class="card"><h2>收货明细 / 图片复制</h2><div class="bar"><label><input id="details" type="checkbox"> 包含各物流单明细</label><button id="copy">复制全部单号＋明细图片</button><button id="save-image">保存明细图片</button></div><p>统计当前批次全部物流单。未关联采购单时只显示实收，不计算差异。</p><div id="report"></div><div id="fallback"></div></div></section></main><dialog id="editor"><form id="edit-form"><h2 id="editor-title">编辑商品</h2><label>SKU / 商品编码<input name="sku_id" required maxlength="200"></label><label>商品名称<input name="name" required maxlength="300"></label><label>条码<input name="sku_code" maxlength="200"></label><label>规格<input name="spec" maxlength="300"></label><label>实收数量<input name="qty" type="number" min="0" step="any" required></label><div class="bar"><button type="submit">保存</button><button type="button" id="cancel-edit">取消</button></div></form></dialog><script src="/unplanned-report.js"></script><script src="/unplanned.js"></script><script src="/purchase-links.js"></script></body></html>
