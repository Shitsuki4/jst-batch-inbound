name: Build Desktop 3.0 EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"
  pull_request:
    paths:
      - ".github/workflows/build-desktop-exe.yml"
      - "desktop/**"

permissions:
  contents: write

concurrency:
  group: desktop-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Package desktop 3.0
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: desktop/requirements-build.txt

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop/requirements-build.txt

      - name: Compile Python sources
        run: python -m compileall -q desktop/backend/app

      - name: Run Python regression
        run: python desktop/backend/app/regression_runner.py

      - name: Build recorder regression
        run: dotnet build desktop/tests/RecorderRegression/RecorderRegression.csproj -c Release

      - name: Run recorder core regression
        shell: pwsh
        run: |
          $exe = "desktop/tests/RecorderRegression/bin/Release/net10.0-windows/RecorderRegression.exe"
          & $exe --output "$env:RUNNER_TEMP/recorder-core"
          if ($LASTEXITCODE -ne 0) { throw "Recorder core regression failed: $LASTEXITCODE" }

      - name: Install FFmpeg for synthetic verification
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          $ffmpeg = Get-ChildItem -Path @(
            "C:\ProgramData\chocolatey\bin\ffmpeg.exe",
            "C:\ProgramData\chocolatey\lib\ffmpeg\tools\ffmpeg\bin\ffmpeg.exe"
          ) -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $ffmpeg) {
            $ffmpeg = Get-Command ffmpeg.exe -ErrorAction SilentlyContinue
          }
          if (-not $ffmpeg) { throw "ffmpeg.exe was not found after installation" }
          $ffmpegPath = if ($ffmpeg.Source) { $ffmpeg.Source } else { $ffmpeg.FullName }
          $ffprobePath = Join-Path (Split-Path -Parent $ffmpegPath) "ffprobe.exe"
          if (-not (Test-Path -LiteralPath $ffprobePath -PathType Leaf)) {
            throw "ffprobe.exe was not found next to $ffmpegPath"
          }
          "SYNTH_FFMPEG=$ffmpegPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SYNTH_FFPROBE=$ffprobePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run synthetic recording verification
        shell: pwsh
        run: |
          $exe = "desktop/tests/RecorderRegression/bin/Release/net10.0-windows/RecorderRegression.exe"
          & $exe --synthetic --output "$env:RUNNER_TEMP/recorder-synthetic"
          if ($LASTEXITCODE -ne 0) { throw "Synthetic recorder verification failed: $LASTEXITCODE" }

      - name: Build portable EXE package
        shell: pwsh
        run: |
          ./desktop/build-windows.ps1 -SkipTests -NoClean

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: jst-batch-inbound-desktop-3.0.0-win-x64
          path: |
            desktop/dist/portable/**
            desktop/dist/jst-batch-inbound-desktop-3.0.0-win-x64.zip
            desktop/dist/SHA256SUMS.txt
            ${{ runner.temp }}/recorder-core/result.json
            ${{ runner.temp }}/recorder-synthetic/result.json
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/jst-batch-inbound-desktop-3.0.0-win-x64.zip
            desktop/dist/SHA256SUMS.txt
          generate_release_notes: true
