name: Build Desktop 3.0 EXE

on:
  workflow_dispatch:
    inputs:
      publish_release_tag:
        description: "Attach the built assets to this existing release tag, e.g. desktop-v3.0.2 (optional; main only; version must match the csproj)."
        required: false
        type: string
  push:
    tags:
      - "desktop-v*"
  pull_request:
    paths:
      - ".github/workflows/build-desktop-exe.yml"
      - "desktop/**"

# Least privilege by default; only the release job below gets contents: write.
permissions:
  contents: read

concurrency:
  group: desktop-exe-${{ github.ref }}
  # Never cancel a run that may publish release assets (tag pushes and manual dispatches).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Package desktop 3.0
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      release_mode: ${{ steps.version.outputs.release_mode }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PUBLISH_RELEASE_TAG: ${{ inputs.publish_release_tag }}
        run: |
          $ErrorActionPreference = "Stop"
          # \z instead of $ so a trailing newline can never slip through.
          $tagPattern = '^desktop-v([0-9]+\.[0-9]+\.[0-9]+)\z'
          $nodes = @(Select-Xml -LiteralPath "desktop/src/Receiving.Native.csproj" -XPath "/Project/PropertyGroup/Version")
          if ($nodes.Count -ne 1) { throw "Expected exactly one <Version> in desktop/src/Receiving.Native.csproj, found $($nodes.Count)" }
          $projectVersion = $nodes[0].Node.InnerText.Trim()
          if ($projectVersion -cnotmatch '^[0-9]+\.[0-9]+\.[0-9]+\z') { throw "csproj <Version> '$projectVersion' is not MAJOR.MINOR.PATCH" }

          $version = $projectVersion
          $releaseTag = ""
          $releaseMode = ""
          if ($env:REF_TYPE -eq "tag") {
            if (-not ($env:REF_NAME -cmatch $tagPattern)) { throw "Tag '$env:REF_NAME' does not match desktop-vMAJOR.MINOR.PATCH" }
            $version = $Matches[1]
            if ($version -ne $projectVersion) { throw "Tag version $version does not match csproj <Version> $projectVersion; bump the csproj before tagging" }
            $releaseTag = $env:REF_NAME
            $releaseMode = "publish"
          } elseif ($env:EVENT_NAME -eq "workflow_dispatch" -and $env:PUBLISH_RELEASE_TAG) {
            if ($env:GIT_REF -ne "refs/heads/main") { throw "Attaching release assets is only allowed from refs/heads/main (got $env:GIT_REF)" }
            if (-not ($env:PUBLISH_RELEASE_TAG -cmatch $tagPattern)) { throw "publish_release_tag must match desktop-vMAJOR.MINOR.PATCH" }
            if ($Matches[1] -ne $projectVersion) { throw "publish_release_tag version $($Matches[1]) does not match csproj <Version> $projectVersion" }
            $releaseTag = $env:PUBLISH_RELEASE_TAG
            $releaseMode = "attach"
          }

          Write-Host "Version: $version; release tag: '$releaseTag'; mode: '$releaseMode'"
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          @(
            "version=$version"
            "release_tag=$releaseTag"
            "release_mode=$releaseMode"
          ) | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: desktop/requirements-build.txt

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop/requirements-build.txt

      - name: Compile Python sources
        run: python -m compileall -q desktop/backend/app

      - name: Run Python regression
        run: python desktop/backend/app/regression_runner.py

      - name: Build recorder regression
        run: dotnet build desktop/tests/RecorderRegression/RecorderRegression.csproj -c Release

      - name: Run recorder core regression
        shell: pwsh
        run: |
          $exe = "desktop/tests/RecorderRegression/bin/Release/net10.0-windows/RecorderRegression.exe"
          & $exe --output "$env:RUNNER_TEMP/recorder-core"
          if ($LASTEXITCODE -ne 0) { throw "Recorder core regression failed: $LASTEXITCODE" }

      - name: Prepare pinned offline dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $deps = Join-Path $env:RUNNER_TEMP "offline-deps"
          New-Item -ItemType Directory -Force -Path $deps | Out-Null

          $webviewUrl = "https://msedge.sf.dl.delivery.mp.microsoft.com/filestreamingservice/files/b92cd7d9-6976-4f34-9708-47e80937c287/Microsoft.WebView2.FixedVersionRuntime.154.0.4258.62.x64.cab"
          $webviewSha = "e8f55a4bde27c7f82512402b56a58539b5ec8928be4e500e077b6f66c9ef4668"
          $ffmpegUrl = "https://github.com/GyanD/codexffmpeg/releases/download/8.1.2/ffmpeg-8.1.2-full_build.zip"
          $ffmpegSha = "b8cdefab5f50590a076c27c2b56b0294a0e6154faded28ba1ba05ebc4f801f57"
          $innoUrl = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
          $innoSha = "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732"

          function Get-Pinned {
            param([string]$Url, [string]$Sha, [string]$Out)
            Write-Host "Downloading $Url"
            & curl.exe -L --fail --retry 3 --retry-delay 5 -o $Out $Url
            if ($LASTEXITCODE -ne 0) { throw "curl failed for $Url ($LASTEXITCODE)" }
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $Out).Hash.ToLowerInvariant()
            if ($actual -ne $Sha) { throw "SHA256 mismatch for $Out; expected $Sha, actual $actual" }
            Write-Host "Verified $Out"
          }

          $webviewCab = Join-Path $deps "webview2-x64.cab"
          $ffmpegZip = Join-Path $deps "ffmpeg-8.1.2-full_build.zip"
          $innoExe = Join-Path $deps "innosetup-6.7.3.exe"

          Get-Pinned -Url $webviewUrl -Sha $webviewSha -Out $webviewCab
          Get-Pinned -Url $ffmpegUrl -Sha $ffmpegSha -Out $ffmpegZip
          Get-Pinned -Url $innoUrl -Sha $innoSha -Out $innoExe

          $ffmpegExtract = Join-Path $deps "ffmpeg"
          Expand-Archive -LiteralPath $ffmpegZip -DestinationPath $ffmpegExtract -Force
          $ffmpegBuild = Get-ChildItem -LiteralPath $ffmpegExtract -Directory |
            Where-Object { Test-Path -LiteralPath (Join-Path $_.FullName "bin\ffmpeg.exe") -PathType Leaf } |
            Select-Object -First 1
          if (-not $ffmpegBuild) { throw "ffmpeg build not found in the downloaded archive" }
          $ffmpeg = Join-Path $ffmpegBuild.FullName "bin\ffmpeg.exe"
          $ffprobe = Join-Path $ffmpegBuild.FullName "bin\ffprobe.exe"

          Write-Host "Installing Inno Setup"
          $proc = Start-Process -FilePath $innoExe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Inno Setup install failed: $($proc.ExitCode)" }
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe was not found after installing Inno Setup" }

          @(
            "SYNTH_FFMPEG=$ffmpeg"
            "SYNTH_FFPROBE=$ffprobe"
            "FFMPEG_BUILD_DIR=$($ffmpegBuild.FullName)"
            "WEBVIEW2_CAB=$webviewCab"
            "WEBVIEW2_CAB_SHA=$webviewSha"
            "INNO_COMPILER=$iscc"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run synthetic recording verification
        shell: pwsh
        run: |
          $exe = "desktop/tests/RecorderRegression/bin/Release/net10.0-windows/RecorderRegression.exe"
          & $exe --synthetic --output "$env:RUNNER_TEMP/recorder-synthetic"
          if ($LASTEXITCODE -ne 0) { throw "Synthetic recorder verification failed: $LASTEXITCODE" }

      - name: Build portable EXE package
        shell: pwsh
        run: |
          ./desktop/build-windows.ps1 -SkipTests -NoClean -Version $env:APP_VERSION

      - name: Run video library UI acceptance (录像查询)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = (Resolve-Path -LiteralPath "desktop/dist/native/Receiving.Native.exe").Path
          $out = Join-Path $env:RUNNER_TEMP "library-ui"
          # WinExe: start it explicitly and wait, so the exit code is the acceptance result.
          $p = Start-Process -FilePath $exe -ArgumentList @("--library-ui-test", "--output", "`"$out`"", "--ffmpeg", "`"$env:SYNTH_FFMPEG`"") -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(420000)) { try { $p.Kill($true) } catch {}; throw "Library UI acceptance timed out" }
          $result = Join-Path $out "library-ui-result.json"
          if (Test-Path -LiteralPath $result) {
            $json = Get-Content -LiteralPath $result -Raw -Encoding UTF8 | ConvertFrom-Json
            Write-Host "ok=$($json.ok) checks=$($json.checks.Count)"
            $json.checks | ForEach-Object { Write-Host "  PASS $_" }
            Write-Host "soft: $($json.soft | ConvertTo-Json -Compress)"
            Write-Host "timings: $($json.timings | ConvertTo-Json -Compress)"
            if ($json.error) { Write-Host "ERROR: $($json.error)" }
          } else { Write-Host "No result file was written" }
          if ($p.ExitCode -ne 0) { throw "Library UI acceptance failed: exit $($p.ExitCode)" }

      - name: Upload video library UI acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-library-ui-acceptance
          path: |
            ${{ runner.temp }}/library-ui/*.json
            ${{ runner.temp }}/library-ui/*.png
          if-no-files-found: warn

      - name: Build full offline installer
        shell: pwsh
        run: |
          ./desktop/build-offline-windows.ps1 `
            -Version $env:APP_VERSION `
            -WebView2Cab $env:WEBVIEW2_CAB `
            -WebView2CabSha256 $env:WEBVIEW2_CAB_SHA `
            -FfmpegBuildDir $env:FFMPEG_BUILD_DIR `
            -InstallerName "ReceivingAssistant-$($env:APP_VERSION)-Offline-Setup" `
            -InnoCompiler $env:INNO_COMPILER

      - name: Verify offline installer (install, shortcuts, force-close / keep / purge uninstall)
        shell: pwsh
        run: |
          $installer = Get-ChildItem "desktop/dist/installer/*.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) { throw "No offline installer was produced" }
          ./desktop/verify-offline-installer.ps1 `
            -Installer $installer.FullName `
            -PayloadRoot "desktop/dist/offline-payload"

      - name: Build runtime dependency installer
        shell: pwsh
        run: |
          ./desktop/build-deps-windows.ps1 `
            -Version $env:APP_VERSION `
            -WebView2Cab $env:WEBVIEW2_CAB `
            -WebView2CabSha256 $env:WEBVIEW2_CAB_SHA `
            -FfmpegBuildDir $env:FFMPEG_BUILD_DIR `
            -InstallerName "ReceivingAssistant-Deps-$($env:APP_VERSION)-Setup" `
            -InnoCompiler $env:INNO_COMPILER

      - name: Verify runtime dependency installer (silent install, portable resolve, uninstall)
        shell: pwsh
        run: |
          $installer = Get-ChildItem "desktop/dist/deps-installer/*.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) { throw "No dependency installer was produced" }
          Write-Host ("Dependency installer: {0} ({1:N1} MiB)" -f $installer.Name, ($installer.Length / 1MB))
          ./desktop/verify-deps-installer.ps1 `
            -Installer $installer.FullName `
            -PayloadRoot "desktop/dist/deps-payload" `
            -PortableRoot "desktop/dist/portable"

      - name: Upload portable artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ env.APP_VERSION }}-portable
          path: |
            desktop/dist/jst-batch-inbound-desktop-${{ env.APP_VERSION }}-win-x64.zip
            desktop/dist/SHA256SUMS.txt
            ${{ runner.temp }}/recorder-core/result.json
            ${{ runner.temp }}/recorder-synthetic/result.json
            desktop/build/verify/installer-report.json
            desktop/build/verify-deps/deps-installer-report.json
          if-no-files-found: error

      - name: Upload full offline installer artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ env.APP_VERSION }}-offline-installer
          path: desktop/dist/installer/*.exe
          if-no-files-found: error
          compression-level: 0

      - name: Upload runtime dependency installer artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ env.APP_VERSION }}-deps-installer
          path: desktop/dist/deps-installer/*.exe
          if-no-files-found: error
          compression-level: 0

      - name: Upload release assets for the release job
        if: steps.version.outputs.release_tag != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ env.APP_VERSION }}-release-assets
          path: |
            desktop/dist/jst-batch-inbound-desktop-${{ env.APP_VERSION }}-win-x64.zip
            desktop/dist/SHA256SUMS.txt
            desktop/dist/installer/ReceivingAssistant-${{ env.APP_VERSION }}-Offline-Setup.exe
            desktop/dist/deps-installer/ReceivingAssistant-Deps-${{ env.APP_VERSION }}-Setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  release:
    name: Publish release assets
    needs: build
    if: needs.build.outputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: desktop-release-${{ needs.build.outputs.release_tag }}
      cancel-in-progress: false
    env:
      APP_VERSION: ${{ needs.build.outputs.version }}
      RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
      RELEASE_MODE: ${{ needs.build.outputs.release_mode }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Re-validate release request
        shell: bash
        env:
          GIT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^desktop-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::invalid release tag"; exit 1; }
          [[ "$RELEASE_TAG" == "desktop-v$APP_VERSION" ]] || { echo "::error::release tag does not match version $APP_VERSION"; exit 1; }
          case "$RELEASE_MODE" in
            publish) [[ "$GIT_REF" == "refs/tags/$RELEASE_TAG" ]] || { echo "::error::publish requires the tag ref"; exit 1; } ;;
            attach) [[ "$GIT_REF" == "refs/heads/main" ]] || { echo "::error::attach is only allowed from main"; exit 1; } ;;
            *) echo "::error::unknown release mode '$RELEASE_MODE'"; exit 1 ;;
          esac

      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-${{ needs.build.outputs.version }}-release-assets
          path: release-assets

      - name: List release assets
        shell: bash
        run: |
          set -euo pipefail
          ls -lR release-assets
          test -f "release-assets/jst-batch-inbound-desktop-$APP_VERSION-win-x64.zip"
          test -f "release-assets/SHA256SUMS.txt"
          test -f "release-assets/installer/ReceivingAssistant-$APP_VERSION-Offline-Setup.exe"
          test -f "release-assets/deps-installer/ReceivingAssistant-Deps-$APP_VERSION-Setup.exe"

      - name: Publish tagged release
        if: needs.build.outputs.release_mode == 'publish'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          files: |
            release-assets/jst-batch-inbound-desktop-${{ needs.build.outputs.version }}-win-x64.zip
            release-assets/installer/ReceivingAssistant-${{ needs.build.outputs.version }}-Offline-Setup.exe
            release-assets/deps-installer/ReceivingAssistant-Deps-${{ needs.build.outputs.version }}-Setup.exe
            release-assets/SHA256SUMS.txt
          generate_release_notes: true

      - name: Attach assets to existing release
        if: needs.build.outputs.release_mode == 'attach'
        shell: bash
        run: |
          set -euo pipefail
          # No --clobber: an asset that already exists is never silently replaced.
          gh release upload "$RELEASE_TAG" \
            "release-assets/jst-batch-inbound-desktop-$APP_VERSION-win-x64.zip" \
            "release-assets/SHA256SUMS.txt" \
            "release-assets/installer/ReceivingAssistant-$APP_VERSION-Offline-Setup.exe" \
            "release-assets/deps-installer/ReceivingAssistant-Deps-$APP_VERSION-Setup.exe"

      - name: Set installer asset labels
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          # The asset file names must stay ASCII (release uploads drop non-ASCII
          # characters), so expose the Chinese names through the asset labels.
          set_label() {
            local name="$1" label="$2" asset_id
            asset_id=$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq ".assets[] | select(.name == \"$name\") | .id")
            if [[ -n "$asset_id" ]]; then
              gh api -X PATCH "repos/$GH_REPO/releases/assets/$asset_id" -f "label=$label" > /dev/null
            fi
          }
          set_label "ReceivingAssistant-$APP_VERSION-Offline-Setup.exe" "收货小助手-$APP_VERSION-离线完整安装程序.exe"
          set_label "ReceivingAssistant-Deps-$APP_VERSION-Setup.exe" "收货小助手-$APP_VERSION-运行依赖安装程序.exe"

      - name: Add gh-proxy download links to release notes
        shell: bash
        run: |
          set -euo pipefail
          # Prepend a gh-proxy.com mirror section to the release body. The marker block is
          # replaced on re-runs (attach mode) so the links never duplicate.
          body=$(gh release view "$RELEASE_TAG" --json body --jq '.body // ""')
          body=$(printf '%s\n' "$body" | awk '
            /<!-- gh-proxy-links:start -->/ {skip=1; next}
            /<!-- gh-proxy-links:end -->/ {skip=0; next}
            !skip {print}
          ')
          {
            echo '<!-- gh-proxy-links:start -->'
            echo '## 国内加速下载（gh-proxy.com）'
            echo
            echo '> 以下链接由 [gh-proxy.com](https://gh-proxy.com) 加速，文件与官方 Release 完全一致，可用 `SHA256SUMS.txt` 校验。'
            echo
            for asset in \
              "jst-batch-inbound-desktop-${APP_VERSION}-win-x64.zip" \
              "ReceivingAssistant-${APP_VERSION}-Offline-Setup.exe" \
              "ReceivingAssistant-Deps-${APP_VERSION}-Setup.exe" \
              "SHA256SUMS.txt"; do
              echo "- [${asset}](https://gh-proxy.com/https://github.com/${GH_REPO}/releases/download/${RELEASE_TAG}/${asset})"
            done
            echo '<!-- gh-proxy-links:end -->'
            echo
            printf '%s\n' "$body"
          } > release-notes.md
          gh release edit "$RELEASE_TAG" --notes-file release-notes.md
          echo "Updated release notes with gh-proxy links for $RELEASE_TAG"
